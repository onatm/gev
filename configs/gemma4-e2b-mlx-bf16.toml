[experiment]
id = "gemma4-e2b-decision-v7-mlx-bf16"

[protocol]
id = "kev-decision-v7"
version = 1

[model]
family = "gemma4_e2b_text"
name = "google/gemma-4-E2B"
revision = "d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f"
expected_model_type = "gemma4"
marker_ids = { state = 6, question = 7, option_start = 8, option_end = 9, decide = 10 }
marker_artifact = "runs/reference/gemma4-e2b-marker-map.json"

[backend]
id = "mlx"

[training]
seed = 2
epochs = 2
learning_rate = 0.0001
dtype = "bf16"
context_length = 384
state_cap = 384
branch_cap = 2048
packed_cap = 2048
logical_batch = 8
microbatch = 1
weight_decay = 0.01
p_none = 0.1
p_none_distract = 0.12
p_distract = 0.15
p_none_pair = 0.25

[runtime]
device = "auto"
mps_fallback = false
output_root = "runs"
execution_mode = "rows"
