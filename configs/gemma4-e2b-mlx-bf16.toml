# Gemma 4 E2B text decoder on MLX (Apple Silicon GPU). Same recipe and checkpoint format as Torch.
name = "gev-gemma4-e2b"
backend = "mlx"
dtype = "bf16"

[model]
family = "gemma4"
name = "google/gemma-4-E2B"
revision = "d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f"

[training]
seed = 0
epochs = 2
learning_rate = 1e-4
logical_batch = 8
microbatch = 1        # MLX is compute-bound here; larger microbatches only add memory
save_every = 250
