[experiment]
id = "gev-smoke"

[protocol]
id = "kev-decision-v7"
version = 1

[model]
family = "gemma3_text"
name = "google/gemma-3-1b-pt"
revision = "fcf18a2a879aab110ca39f8bffbccd5d49d8eb29"
expected_model_type = "gemma3_text"

[backend]
id = "torch"

[training]
seed = 0
epochs = 2
learning_rate = 0.0001
dtype = "fp32"
context_length = 384
state_cap = 384
branch_cap = 1024
packed_cap = 2048
