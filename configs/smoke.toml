# Small structural smoke run on a `gev data sample` subset; not a comparable score.
name = "gev-smoke"
backend = "torch"
dtype = "bf16"

[model]
family = "gemma3"
name = "google/gemma-3-1b-pt"
revision = "fcf18a2a879aab110ca39f8bffbccd5d49d8eb29"

[training]
epochs = 1
logical_batch = 8
microbatch = 8
branch_cap = 1024
