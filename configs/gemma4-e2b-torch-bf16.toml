# Gemma 4 E2B text decoder on PyTorch (CUDA/MPS/CPU). BF16 frozen base, FP32 LoRA + pointer head.
name = "gev-e2b"
backend = "torch"
dtype = "bf16"

[model]
family = "gemma4"
name = "google/gemma-4-E2B"
revision = "d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f"

[training]
seed = 0
epochs = 2
learning_rate = 1e-4
logical_batch = 8
microbatch = 1        # records per forward; raise on 80 GB GPUs (see README)
save_every = 250
