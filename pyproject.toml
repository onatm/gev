[project]
name = "gev"
version = "0.1.0"
description = "Train, evaluate, and publish Jev-like decision models (LoRA + pointer head) on Gemma"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "huggingface-hub>=1.5,<2",
  "numpy>=2.2,<3",
  "peft==0.21.0",
  "safetensors>=0.6,<1",
  "torch==2.8.0",
  "transformers==5.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
mlx = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
gev = "gev.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
